name: WaterPoloBoard
options:
  bundleIdPrefix: com.waterpolo
  deploymentTarget:
    iOS: "15.0"
targets:
  WaterPoloBoard:
    type: application
    platform: iOS
    sources:
      - path: WaterPoloBoard
      - path: WebAssets
        type: folder
    info:
      path: WaterPoloBoard/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Waterpolo Board
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "103"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: Save tactical board snapshots to your photo library.
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waterpolo.tacticalboard
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "103"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
